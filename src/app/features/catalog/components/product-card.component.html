<a class="card-link" [routerLink]="['/product', product.id]" [attr.aria-label]="'Ver pulseira ' + product.name">
  <article class="card">
    <div class="image">
      <img [src]="product.images[0]" [alt]="product.name" />
    </div>
    <div class="body">
      <p class="category">{{ product.category }}</p>
      <h3>{{ product.name }}</h3>
      <p class="price">{{ product.price | currency:'BRL' }}</p>
      <span class="cta">Ver pulseira</span>
    </div>
  </article>
</a>
